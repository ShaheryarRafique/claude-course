<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Claude Zero to Master</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css" id="base-theme" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <!--
          Each module is one markdown file in the slides folder.
          A slide break is a line with three dashes. Speaker notes start with a line that says Note:.
          Always leave a blank line after any raw HTML tag so the markdown below it is parsed.
        -->
        <section data-markdown="slides/title.md?b=86" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/module-01.md?b=86" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/module-02.md?b=86" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <!-- 6-module structure. M1 Claude Essentials (merges old 1+2), M2 The 4D Framework (built from
             Anthropic's AI Fluency + Claude 101). M3 Introduction to Cowork, M4 Claude Code, M5 The Claude API,
             M6 Capstone Project are named only for now and will be built next. Each module is one file in slides/. -->
      </div>

      <!-- brand footer, fixed on every slide -->
      <div class="brand-footer">Claude Zero to Master</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/highlight.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/monokai.css" />
    <script>
      Reveal.initialize({
        hash: true,
        slideNumber: 'c/t',
        transition: 'slide',
        transitionSpeed: 'fast',
        controls: false,
        controlsTutorial: false,
        progress: true,
        center: true,
        margin: 0.08,
        width: 1280,
        height: 720,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      });
    </script>
  </body>
</html>
